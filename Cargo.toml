[workspace]
members = ["core"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

# A panic aborts the whole Wasm instance, and with it every other request it
# is serving, so panicking shortcuts are compile errors in server code.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
unreachable = "deny"
todo = "deny"

[package]
name = "magi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "A wizard worm that powers an orb."

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true

[dependencies]
magi-core = { path = "core" }
worker = "0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "Pbkdf2Params"] }
serde = "1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
