name: ci

on:
  pull_request:
  push:
    branches:
      - master
      - t3/live-paste

permissions:
  contents: read

# New commits supersede older runs for the same pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov
      - run: cargo fmt --check
      - run: cargo clippy --locked -p magi --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy --locked -p magi-core --all-targets -- -D warnings
      - run: cargo llvm-cov --locked -p magi-core --fail-under-lines 100 --fail-under-functions 100

  http:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/worker-tools
      - run: bun run lint
      - run: bun run tsc
      - run: bun run test:http

  required-ci:
    name: CI / Required
    # Always report a result, including when a prerequisite failed or was skipped.
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - rust
      - http
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR validation job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq --exit-status 'length > 0 and all(. != "failure" and . != "cancelled")' <<< "$RESULTS"

  deploy:
    # A merge goes live only once the tests pass on the merged code.
    if: ${{ github.event_name == 'push' }}
    needs:
      - rust
      - http
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/worker-tools
      - run: bun run wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
