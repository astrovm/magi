name: worker tools
description: Everything needed to build the Worker. Check out the repo first.

runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
    - name: Install the worker-build that matches the worker crate
      shell: bash
      run: |
        version="$(cargo metadata --locked --format-version 1 | jq -r '.packages[] | select(.name == "worker") | .version')"
        cargo install worker-build --locked --version "$version"
