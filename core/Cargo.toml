[package]
name = "magi-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Everything Magi does, with Cloudflare kept behind a trait so it runs in plain tests."

[lints]
workspace = true

[dependencies]
base64 = "0.23"
md-5 = "0.11"
qrcodegen = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2.5"

[dev-dependencies]
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
pollster = "1"
